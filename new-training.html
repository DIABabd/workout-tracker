<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>new training</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="new-training.css">
</head>
<body>
    <div class="container">
        <div class="training-card">
            <div class="exercise-date-type">
                <form>
                    <label for="exercise-date">Date:</label>
                    <input type="date" id="exercise-date" name="exercise-date" required>
                    <label for="training-day">Training:</label>
                    <select name="training-day" id="training-day" required>
                        <option value="chest-triceps">Chest-Triceps</option>
                        <option value="back-biceps">Back-Biceps</option>
                        <option value="shoulders-traps">Shoulders-Traps</option>
                        <option value="legs-core">Legs-Core</option>
                        <option value="boxing">Boxing</option>
                    </select>        
            </div>
        
            <div class="exercise-name-weight">
                    <label for="exercise-name">Exercise:</label>
                    <input type="text" id="exercise-name" name="exercise-name" required>
                    <label for="exercise-weight">Weight (kg):</label>
                    <input type="number" id="exercise-weight" name="exercise-weight" min="0" step="0.5" required>
            </div>
            
            
            <div class="exercise-sets-reps">
                    <label for="exercise-sets">Sets:</label>
                    <input type="number" id="exercise-sets" name="exercise-sets" min="0" required>
                    <label for="exercise-reps">Reps:</label>
                    <input type="number" id="exercise-reps" name="exercise-reps" min="0" required>
            </div>

            <div class="training-submit-back">
                    <input type="submit" value="Save">
                </form>

                <a href="index.html" class="btn">Back</a>
            </div>
        </div>
    </div>
    
</body>
</html>
